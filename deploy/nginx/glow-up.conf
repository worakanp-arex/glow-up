# ไซต์ Nginx สำหรับ glow-up — แทนที่ YOUR_DOMAIN ก่อนใช้งาน
# คัดลอกไปที่ /etc/nginx/sites-available/glow-up แล้วทำ symlink ไปที่ sites-enabled
# certbot --nginx จะเพิ่มบล็อก HTTPS (443) และ redirect ให้อัตโนมัติ

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# เพดานจำนวนคำขอต่อผู้เข้าชมสำหรับ API แอปมีขีดจำกัดของตัวเอง (ล็อกอิน,
# OTP...) ส่วนตรงนี้กันการถล่มคำขอก่อนจะไปถึง Node ด้วยซ้ำ
limit_req_zone $binary_remote_addr zone=glowup_api:10m rate=30r/s;

server {
    listen 80;
    listen [::]:80;
    server_name YOUR_DOMAIN;

    # ไม่เปิดเผยเวอร์ชัน nginx ใน header และหน้า error
    server_tokens off;

    root /var/www/glow-up;
    index index.html;

    include /etc/nginx/snippets/glow-up-security-headers.conf;

    # แอปจำกัด body แบบ JSON ที่ 1 MB จึงไม่ต้องใหญ่กว่านั้น
    # ยกเว้น endpoint อัปโหลดด้านล่าง (สูงสุด 10 ไฟล์ x 5 MB ดู backend/src/middleware/upload.js)
    client_max_body_size 2m;

    # API
    location /api/ {
        limit_req zone=glowup_api burst=60 nodelay;
        include /etc/nginx/snippets/glow-up-security-headers.conf;
        proxy_pass http://127.0.0.1:5001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # endpoint ที่รับไฟล์อัปโหลดต้องใช้ขีดจำกัด body ที่ใหญ่กว่า
    location ~ ^/api/(auth/register/request-otp|users/me/(avatar|resume|certificates)|applications/jobs/[^/]+/apply|courses/(cover|[^/]+/certificate)|jobs/[^/]+/image)$ {
        client_max_body_size 55m;
        limit_req zone=glowup_api burst=20 nodelay;
        include /etc/nginx/snippets/glow-up-security-headers.conf;
        proxy_pass http://127.0.0.1:5001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ไฟล์ที่อัปโหลด (backend ตรวจสิทธิ์)
    location /uploads/ {
        include /etc/nginx/snippets/glow-up-security-headers.conf;
        proxy_pass http://127.0.0.1:5001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Socket.IO (WebSocket)
    location /socket.io/ {
        include /etc/nginx/snippets/glow-up-security-headers.conf;
        proxy_pass http://127.0.0.1:5001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
    }

    # JS/CSS ที่ build แล้วมีชื่อไฟล์เป็นแฮช — แคชได้นาน
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        include /etc/nginx/snippets/glow-up-security-headers.conf;
        try_files $uri =404;
    }

    # React Router: ส่งทุก path ที่เหลือไปที่ index.html
    location / {
        add_header Cache-Control "no-cache";
        include /etc/nginx/snippets/glow-up-security-headers.conf;
        try_files $uri $uri/ /index.html;
    }
}
