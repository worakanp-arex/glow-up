# Nginx site for glow-up — replace YOUR_DOMAIN before use.
# Copy to /etc/nginx/sites-available/glow-up and symlink into sites-enabled.
# certbot --nginx will add the HTTPS (443) block and redirect automatically.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# Per-visitor request ceiling for the API. The app has its own limits (login,
# OTP...); this stops floods before they reach Node at all.
limit_req_zone $binary_remote_addr zone=glowup_api:10m rate=30r/s;

server {
    listen 80;
    listen [::]:80;
    server_name YOUR_DOMAIN;

    # Don't announce the nginx version in headers and error pages.
    server_tokens off;

    root /var/www/glow-up;
    index index.html;

    include /etc/nginx/snippets/glow-up-security-headers.conf;

    # JSON bodies are capped at 1 MB by the app, so nothing needs more than that
    # except the upload endpoints below (up to 10 files x 5 MB, see backend/src/middleware/upload.js).
    client_max_body_size 2m;

    # API
    location /api/ {
        limit_req zone=glowup_api burst=60 nodelay;
        include /etc/nginx/snippets/glow-up-security-headers.conf;
        proxy_pass http://127.0.0.1:5001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Endpoints that accept file uploads need the larger body limit.
    location ~ ^/api/(auth/register/request-otp|users/me/(avatar|resume|certificates)|applications/jobs/[^/]+/apply|courses/(cover|[^/]+/certificate)|jobs/[^/]+/image)$ {
        client_max_body_size 55m;
        limit_req zone=glowup_api burst=20 nodelay;
        include /etc/nginx/snippets/glow-up-security-headers.conf;
        proxy_pass http://127.0.0.1:5001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Uploaded files (backend checks permissions)
    location /uploads/ {
        include /etc/nginx/snippets/glow-up-security-headers.conf;
        proxy_pass http://127.0.0.1:5001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Socket.IO (WebSocket)
    location /socket.io/ {
        include /etc/nginx/snippets/glow-up-security-headers.conf;
        proxy_pass http://127.0.0.1:5001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
    }

    # Built JS/CSS have hashed names — cache for a long time
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        include /etc/nginx/snippets/glow-up-security-headers.conf;
        try_files $uri =404;
    }

    # React Router: send every other path to index.html
    location / {
        add_header Cache-Control "no-cache";
        include /etc/nginx/snippets/glow-up-security-headers.conf;
        try_files $uri $uri/ /index.html;
    }
}
