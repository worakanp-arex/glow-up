# security header สำหรับทุก response ที่ nginx ให้บริการ ถูก include โดย glow-up.conf
#
# nginx ไม่สืบทอด add_header ระดับ server ไปยัง location ที่ตั้ง add_header ของตัวเอง
# ดังนั้น glow-up.conf จึง include ไฟล์นี้ในบล็อก server และซ้ำใน
# ทุก location ที่เพิ่ม header (Cache-Control)
#
# Content-Security-Policy ต้องตรงกับ backend/src/config/csp.js และ
# frontend/vercel.json ทุกตัวอักษร; backend/test/security-headers.test.js ตรวจเรื่องนี้
add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; script-src 'self' https://accounts.google.com/gsi/client; style-src 'self' https://accounts.google.com/gsi/style 'sha256-RU4sU0AaS8IBGZx8XrGt/pa9A5SLA3dQszGeqT5L3Kw='; style-src-attr 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self'; connect-src 'self' https://accounts.google.com/gsi/; frame-src https://accounts.google.com/gsi/" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "no-referrer" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
# บังคับ HTTPS เป็นเวลา 1 ปี (เบราว์เซอร์เมินเมื่อเข้าผ่าน http ธรรมดา จึงมีผล
# หลังจาก certbot เพิ่มบล็อก 443 แล้วเท่านั้น) ไม่มี includeSubDomains: เฉพาะโฮสต์นี้
add_header Strict-Transport-Security "max-age=31536000" always;
