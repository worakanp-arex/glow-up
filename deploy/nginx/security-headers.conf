# Security headers for every response nginx serves. Included by glow-up.conf.
#
# nginx does NOT inherit server-level add_header into a location that sets its own
# add_header, so glow-up.conf includes this file in the server block and again in
# each location that adds a header (Cache-Control).
#
# The Content-Security-Policy must match backend/src/config/csp.js and
# frontend/vercel.json exactly; backend/test/security-headers.test.js checks it.
add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; script-src 'self' https://accounts.google.com/gsi/client; style-src 'self' https://accounts.google.com/gsi/style 'sha256-RU4sU0AaS8IBGZx8XrGt/pa9A5SLA3dQszGeqT5L3Kw='; style-src-attr 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self'; connect-src 'self' https://accounts.google.com/gsi/; frame-src https://accounts.google.com/gsi/" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "no-referrer" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
# HTTPS-only for a year (ignored by browsers over plain http, so it only takes
# effect once certbot has added the 443 block). No includeSubDomains: this host only.
add_header Strict-Transport-Security "max-age=31536000" always;
